; ============================================================
; PlatformIO configuration – ESP32-S3 + Arduino
; Alphasense B43F via ADS1115 (I2C 16-bit ADC)
; ------------------------------------------------------------
; NOTE: Board settings are based on a typical ESP32-S3 DevKit.
;       Adjust 'board', flash size, partition scheme and USB
;       settings to match your exact hardware revision.
;
; I2C pins (SDA=8, SCL=9) match the FirmwareSensy
; sensy_2024 V3/V4 ESP32-S3 variants.
; Override with -DSDA_PIN=x -DSCL_PIN=y if needed.
; ============================================================

[platformio]
default_envs = esp32s3

; ---- shared options ----------------------------------------
[common]
monitor_speed  = 115200
build_flags    =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; ---- I2C pins (FirmwareSensy sensy_2024 V3/V4 style)
    -DSDA_PIN=8
    -DSCL_PIN=9
    ; ---- ADS1115 / sampling tunables (also overridable in config.h)
    -DSAMPLE_INTERVAL_MS=1000
    -DEMA_ALPHA=0.1f

; ---- default environment -----------------------------------
[env:esp32s3]
platform              = espressif32
board                 = esp32-s3-devkitc-1
framework             = arduino

; Serial / monitor
monitor_speed         = ${common.monitor_speed}
monitor_filters       = esp32_exception_decoder, colorize

; Upload
upload_protocol       = esptool

; Board / build
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_upload.flash_size         = 8MB
board_build.partitions          = default_8MB.csv
board_build.mcu                 = esp32s3

build_flags = ${common.build_flags}

; ADS1115 16-bit I2C ADC driver
lib_deps =
    adafruit/Adafruit ADS1X15@^2.5.0
