; ============================================================
; PlatformIO configuration – ESP32-S3 + Arduino
; Alphasense B43F ADC reader
; ------------------------------------------------------------
; NOTE: Board settings are based on a typical ESP32-S3 DevKit.
;       Adjust 'board', flash size, partition scheme and USB
;       settings to match your exact hardware revision.
; ============================================================

[platformio]
default_envs = esp32s3

; ---- shared options ----------------------------------------
[common]
monitor_speed  = 115200
build_flags    =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; ---- ADC / project tunables (also overridable in config.h)
    -DSAMPLE_INTERVAL_MS=500
    -DOVERSAMPLING_COUNT=16
    -DMOVING_AVG_SIZE=8

; ---- default environment -----------------------------------
[env:esp32s3]
platform              = espressif32
board                 = esp32-s3-devkitc-1
framework             = arduino

; Serial / monitor
monitor_speed         = ${common.monitor_speed}
monitor_filters       = esp32_exception_decoder, colorize

; Upload
upload_protocol       = esptool

; Board / build
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_upload.flash_size         = 8MB
board_build.partitions          = default_8MB.csv
board_build.mcu                 = esp32s3

build_flags = ${common.build_flags}

; No extra library dependencies required for bare analogRead.
; Add here if you later use IIR/Kalman libs, etc.
; lib_deps =
